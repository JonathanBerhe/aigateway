# Fake OpenAI-compatible upstream for the smoke tests.
# Run it with: openresty -p tests/mock -c conf/nginx.conf
#
# /cheap/v1/chat/completions and /strong/v1/chat/completions answer like a
# model server would. The gateway points each tier at one of them.
# /cheap/anthropic/v1/messages and /strong/anthropic/v1/messages answer like
# the Anthropic Messages API, for AIGW_<TIER>_FORMAT=anthropic.

worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    lua_package_path "$prefix/lua/?.lua;;";
    access_log logs/access.log;

    server {
        listen 19000;

        location ~ ^/(?<mock_tier>cheap|strong)/v1/chat/completions$ {
            content_by_lua_block { require("mock").chat(ngx.var.mock_tier) }
        }

        location ~ ^/(?<mock_tier>cheap|strong)/anthropic/v1/messages$ {
            content_by_lua_block { require("mock").messages(ngx.var.mock_tier) }
        }
    }
}
