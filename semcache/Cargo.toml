[package]
name = "aigw-semcache"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
description = "Semantic cache sidecar for aigateway: MiniLM embeddings with Burn and a vector index."

[lib]
name = "semcache"
path = "src/lib.rs"

[[bin]]
name = "aigw-semcache"
path = "src/main.rs"

[[bin]]
name = "semcache-eval"
path = "src/bin/semcache-eval.rs"

[[bin]]
name = "semcache-embed"
path = "src/bin/semcache-embed.rs"

[[bin]]
name = "router-eval"
path = "src/bin/router-eval.rs"

[[bin]]
name = "router-head"
path = "src/bin/router-head.rs"

[[bin]]
name = "guard-eval"
path = "src/bin/guard-eval.rs"

[[bin]]
name = "semcache-bench"
path = "src/bin/semcache-bench.rs"

[dependencies]
# Burn 0.22 selects the backend at runtime through Device. "flex" is the pure
# Rust CPU backend, and the default device when it is the only one enabled.
burn = { version = "0.22.0", default-features = false, features = ["std", "flex"] }
# Pinned commit of https://github.com/tracel-ai/models (2026-10-26).
minilm-burn = { git = "https://github.com/tracel-ai/models", rev = "e5d10bfbd182df9803c6637221d120f9d786364d" }
burn-store = { version = "0.22.0", default-features = false, features = ["std", "safetensors"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# The heuristic router of the gateway: the baseline of router-eval.
aigw-core = { path = "../core" }

[profile.release]
debug = "line-tables-only"
