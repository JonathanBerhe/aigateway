# aigateway data plane, phase 1.
#
# Start it with scripts/gateway.sh, which sets the prefix (-p) to the folder
# that holds conf/, lua/ and logs/, and writes conf/generated.conf first.

worker_processes auto;
error_log logs/error.log info;
pid logs/nginx.pid;

# NGINX removes environment variables from its processes. Each variable that
# gateway/lua/aigw/config.lua reads must be listed here.
env AIGW_CORE_LIB;
env AIGW_API_KEYS;
env AIGW_ROUTER;
env AIGW_ROUTER_THRESHOLD;
env AIGW_ROUTER_ADDR;
env AIGW_ROUTER_TIMEOUT_MS;
env AIGW_ROUTER_MODEL_SHARE;
env AIGW_ROUTER_SHADOW;
env AIGW_GUARD;
env AIGW_GUARD_ACTION;
env AIGW_GUARD_ADDR;
env AIGW_GUARD_TIMEOUT_MS;
env AIGW_MAX_BUFFERED_RESPONSE;
env AIGW_CHEAP_BASE_URL;
env AIGW_CHEAP_MODEL;
env AIGW_CHEAP_API_KEY;
env AIGW_CHEAP_STREAM_USAGE;
env AIGW_CHEAP_FORMAT;
env AIGW_CHEAP_MAX_TOKENS;
env AIGW_STRONG_BASE_URL;
env AIGW_STRONG_MODEL;
env AIGW_STRONG_API_KEY;
env AIGW_STRONG_STREAM_USAGE;
env AIGW_STRONG_FORMAT;
env AIGW_STRONG_MAX_TOKENS;
env AIGW_CACHE_ADDR;
env AIGW_CACHE_THRESHOLD;
env AIGW_CACHE_TTL;
env AIGW_CACHE_TIMEOUT_MS;

events {
    worker_connections 4096;
}

http {
    lua_package_path "$prefix/lua/?.lua;;";
    lua_shared_dict aigw_metrics 1m;

    # DNS resolver and CA bundle for this host. proxy_pass with variables
    # resolves names at request time with this resolver. It does not read
    # /etc/hosts, so use an IP address or a DNS name in *_BASE_URL.
    include generated.conf;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;

    # Read the configuration and load the Rust core in the master process.
    # Workers inherit both when NGINX forks them. A bad configuration stops
    # the gateway here, at startup.
    init_by_lua_block {
        local config = require("aigw.config").load()
        local version = require("aigw.core").init(config.core_lib)
        require("aigw.handler")
        ngx.log(ngx.NOTICE, "aigw: native core ", version, " loaded from ", config.core_lib)
    }

    log_format aigw escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","status":$status,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time","tier":"$aigw_tier",'
        '"model":"$aigw_model","reason":"$aigw_reason","score":"$aigw_score",'
        '"prompt_tokens":$aigw_prompt_tokens,"completion_tokens":$aigw_completion_tokens,'
        '"token_source":"$aigw_token_source","cache":"$aigw_cache","cache_score":"$aigw_cache_score",'
        '"cache_rerank":"$aigw_cache_rerank","guard":"$aigw_guard","route_version":"$aigw_route_version",'
        '"guard_version":"$aigw_guard_version","shadow_tier":"$aigw_shadow_tier"}';

    server {
        listen 8000;

        # Keep each request body in memory, so the access phase can read it.
        client_max_body_size 8m;
        client_body_buffer_size 8m;

        # Per-request values. Lua fills them in, proxy_pass and the log read them.
        set $aigw_target_scheme "";
        set $aigw_target_authority "";
        set $aigw_target_path "";
        set $aigw_target_sni "";
        set $aigw_tier "";
        set $aigw_model "";
        set $aigw_reason "";
        set $aigw_score "";
        set $aigw_prompt_tokens 0;
        set $aigw_completion_tokens 0;
        set $aigw_token_source "none";
        set $aigw_cache "";
        set $aigw_cache_score "";
        set $aigw_cache_rerank "";
        set $aigw_guard "";
        set $aigw_route_version "";
        set $aigw_guard_version "";
        set $aigw_shadow_tier "";

        access_log logs/access.log aigw;

        location = /v1/chat/completions {
            access_by_lua_block        { require("aigw.handler").access() }
            header_filter_by_lua_block { require("aigw.handler").header_filter() }
            body_filter_by_lua_block   { require("aigw.handler").body_filter() }
            log_by_lua_block           { require("aigw.handler").log() }

            # With variables in proxy_pass, NGINX sends this exact URI upstream.
            proxy_pass $aigw_target_scheme://$aigw_target_authority$aigw_target_path;

            proxy_http_version 1.1;
            proxy_set_header Host $aigw_target_authority;
            proxy_set_header Connection "";
            proxy_set_header X-Request-Id $request_id;
            # Ask for an uncompressed reply, so the body filter can read it.
            proxy_set_header Accept-Encoding "";
            proxy_ssl_server_name on;
            proxy_ssl_name $aigw_target_sni;

            # Pass each SSE chunk to the client as soon as it arrives.
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        location = /v1/models {
            content_by_lua_block { require("aigw.handler").models() }
        }

        location / {
            content_by_lua_block { require("aigw.handler").not_found() }
        }
    }

    # Status port: health and Prometheus metrics. Do not expose it publicly.
    server {
        listen 8001;
        access_log off;

        location = /healthz {
            content_by_lua_block { require("aigw.handler").health() }
        }

        location = /metrics {
            content_by_lua_block { require("aigw.metrics").expose() }
        }
    }
}
